name: Dynamic Build and Push Docker Images

on:
  workflow_call:
    inputs:
      ignore-dirs:
        description: 'Comma-separated list of directories to ignore'
        required: false
        type: string
        default: '.github/**'
      target-branch:
        description: 'The target branch for tag generation (default: main)'
        required: false
        type: string
        default: 'main'
    outputs:
      matrix:
        description: 'JSON array of changed directories'
        value: ${{ jobs.detect-images-changes.outputs.changed-dirs-matrix }}

jobs:
  detect-images-changes:
    name: Build and Push Changed Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-dirs-matrix: ${{ steps.detect-changes.outputs.changed_dirs_matrix }}

    steps:
      - name: Checkout Calling Repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect Changed Directories
        id: detect-changes
        uses: srekit/github-workflows/.github/actions/detect-files-changes@feature/workflow-dynamic-build-and-push
        with:
          ignore-dirs: ${{ inputs.ignore-dirs }}

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: detect-images-changes
    if: needs.detect-images-changes.outputs.changed-dirs-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect-images-changes.outputs.changed-dirs-matrix) }}

    steps:
      - name: Checkout Calling Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set Image Name
        id: image-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.folder }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Generate image tag
        id: generate-tag
        uses: srekit/github-workflows/.github/actions/generate-tag@feature/workflow-dynamic-build-and-push
        with:
          target-branch: ${{ inputs.target-branch }}

      - name: Log in to GitHub Container Registry
        id: login-cr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and Push Docker image for ${{ matrix.folder }}
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.folder }}
          push: true
          tags: |
            ${{ steps.image-name.outputs.IMAGE_NAME }}:${{ steps.generate-tag.outputs.tag }}
            ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.target-branch && format('{0}:latest', steps.image-name.outputs.IMAGE_NAME) || '' }}

  cleanup-pr-tags:
    name: Cleanup PR Tags on Closed PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.target-branch

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Cleanup PR Tags
        id: cleanup-pr-tags
        uses: srekit/github-workflows/.github/actions/cleanup-pr-tags@feature/workflow-dynamic-build-and-push
        with:
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
