name: Build Poetry

on:
  workflow_call:
    inputs:
      poetry-image:
        description: 'Container image to use for building'
        required: false
        type: string
        default: 'ghcr.io/srekit/custom-images/build-poetry:latest'

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.poetry-image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Poetry Quality Checks
        uses: ./.github/actions/poetry-quality-checks

