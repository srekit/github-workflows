name: Build Poetry

on:
  workflow_call:
    inputs:
      poetry-image:
        description: 'Container image to use for building'
        required: false
        type: string
        default: 'ghcr.io/srekit/custom-images/build-poetry:pr-3-a1d2d7d'

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.poetry-image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Poetry Quality Checks
        uses: srekit/github-workflows/.github/actions/poetry-quality-checks@feature/build-poetry-workflow
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          poetry-version: '1.8.0'
          python-version: '3.14'

      - name: Run Poetry Security Scan
        uses: srekit/github-workflows/.github/actions/poetry-security-scan@feature/build-poetry-workflow
        with:
          poetry-version: '1.8.0'
          python-version: '3.14'

