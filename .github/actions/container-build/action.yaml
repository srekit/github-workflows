name: 'Container Build and Push'
description: 'Build Docker image and push to GitHub Container Registry'
inputs:
  github-token:
    description: 'GitHub token for pushing to GHCR'
    required: true
  image-name:
    description: 'Name of the container image (without registry prefix)'
    required: true
  dockerfile-path:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  context-path:
    description: 'Build context path'
    required: false
    default: '.'
  build-args:
    description: 'Build arguments (one per line)'
    required: false
    default: ''
  tags:
    description: 'Additional tags (one per line)'
    required: false
    default: ''

#outputs:
#  image-tag:
#    description: 'Full image tag that was built'
#    value: ${{ steps.meta.outputs.tags }}
#  image-digest:
#    description: 'Image digest'
#    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker

    - name: Build and Push Docker image for ${{ inputs.image-name }}
      id: build-and-push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context-path }}
        push: true
        dockerfile: ${{ inputs.dockerfile-path }}
        tags: |
          ${{ inputs.tags }}
