name: 'Generate Image Tag'
description: 'Generate image tag based on workflow trigger (PR or main branch push)'
inputs:
  target-branch:
    description: 'The target branch for the tag generation (default: main)'
    required: false
    default: 'main'
outputs:
  tag:
    description: 'Generated image tag'
    value: ${{ steps.generate-tag.outputs.tag }}
runs:
  using: 'composite'
  steps:
    - name: Generate Tag
      id: generate-tag
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        SHORT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
        
        if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TAG="PR-${PR_NUMBER}-${SHORT_HASH}"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG="${TAG_NAME}"
        elif [ "$GITHUB_EVENT_NAME" == "push" ]; then
          CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            DATE=$(date +%Y%m%d)
            TAG="${DATE}-${SHORT_HASH}"
          else
            echo "Expected push to branch '$TARGET_BRANCH', but got '$CURRENT_BRANCH' (Ref: $GITHUB_REF)"
            exit 1
          fi
        else
          echo "Unsupported event: $GITHUB_EVENT_NAME"
          exit 1
        fi
        
        TAG_LOWER=$(echo "${TAG}" | tr '[:upper:]' '[:lower:]')
        echo "tag=${TAG_LOWER}" >> $GITHUB_OUTPUT
        echo "Generated tag: ${TAG_LOWER}"
