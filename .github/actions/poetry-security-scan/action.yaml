name: 'Poetry Security Scan'
description: 'Run security scans on Poetry-based Python projects'
inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.13'
  poetry-version:
    description: 'Poetry version to install'
    required: false
    default: '1.8.0'
  fail-on-severity:
    description: 'Fail on vulnerabilities of this severity or higher (low, medium, high, critical)'
    required: false
    default: 'high'

runs:
  using: 'composite'
  steps:
    - name: Cache Poetry Dependencies
      id: cache-poetry
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Poetry Install
      id: poetry-install
      shell: bash
      run: |
        echo "::group::Poetry Install Results"
        poetry install --with dev
        echo "::endgroup::"

    - name: Run Bandit Security Scan
      id: bandit-scan
      shell: bash
      run: |
        echo "::group::Bandit Security Scan"
        poetry add --group dev bandit
    
        # Generate filtered JSON report (only high/critical severity)
        poetry run bandit -r . --severity-level high --exclude ./.venv -f json -o bandit-report.json || true
    
        # Display filtered results in logs
        poetry run bandit -r . --severity-level high --exclude ./.venv || true
    
        # Check if high/critical issues were found and fail if needed
        if [ -s bandit-report.json ]; then
          ISSUE_COUNT=$(poetry run python -c "import json; data=json.load(open('bandit-report.json')); print(len(data.get('results', [])))")
          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "::error::Found $ISSUE_COUNT high/critical security issues"
            exit 1
          fi
        fi
        echo "::endgroup::"

    - name: Run Trivy Security Scan
      id: trivy-scan
      shell: bash
      run: |
        echo "::group::Trivy Security Scan"
        
        trivy fs \
          --severity HIGH,CRITICAL \
          --format json \
          --output trivy-report.json \
          --scanners vuln,secret,misconfig \
          .
        
        trivy fs --severity HIGH,CRITICAL .
        
        ISSUE_COUNT=$(jq '.Results[].Vulnerabilities | length' trivy-report.json | awk '{s+=$1} END {print s}')
        if [ "$ISSUE_COUNT" -gt 0 ]; then
          echo "::error::Found $ISSUE_COUNT high/critical security issues"
          exit 1
        fi
        echo "::endgroup::"

    - name: Generate Security Summary
      id: generate-summary
      shell: bash
      run: |
        echo "::group::Generating Security Summary"
        
        cat > security-summary.md << 'EOF'
        # 🔒 Security Scan Results
        
        ## Bandit (SAST)
        EOF
        
        # Parse Bandit results
        if [ -f bandit-report.json ]; then
          BANDIT_COUNT=$(poetry run python -c "import json; data=json.load(open('bandit-report.json')); print(len(data.get('results', [])))" 2>/dev/null || echo "0")
          
          if [ "$BANDIT_COUNT" -gt 0 ]; then
            echo "- ⚠️ Found **$BANDIT_COUNT** high/critical issues" >> security-summary.md
            echo "" >> security-summary.md
            poetry run python << 'PYTHON'
        import json
        with open('bandit-report.json') as f:
            data = json.load(f)
            for issue in data.get('results', [])[:10]:  # Limit to first 10
                print(f"- **{issue['issue_severity']}**: {issue['issue_text']}")
                print(f"  - File: `{issue['filename']}:{issue['line_number']}`")
        PYTHON
          else
            echo "- ✅ No high/critical issues found" >> security-summary.md
          fi
        else
          echo "- ℹ️ No scan results available" >> security-summary.md
        fi
        
        cat >> security-summary.md << 'EOF'
        
        ## Trivy (Dependencies & Misconfigurations)
        EOF
        
        # Parse Trivy results
        if [ -f trivy-report.json ]; then
          TRIVY_COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-report.json)
          
          if [ "$TRIVY_COUNT" -gt 0 ]; then
            echo "- ⚠️ Found **$TRIVY_COUNT** high/critical vulnerabilities" >> security-summary.md
            echo "" >> security-summary.md
            jq -r '.Results[] | select(.Vulnerabilities) | .Vulnerabilities[:5][] | "- **\(.Severity)**: \(.VulnerabilityID) - \(.PkgName) \(.InstalledVersion)\n  - \(.Title)"' trivy-report.json >> security-summary.md 2>/dev/null || true
          else
            echo "- ✅ No high/critical vulnerabilities found" >> security-summary.md
          fi
        else
          echo "- ℹ️ No scan results available" >> security-summary.md
        fi
        
        cat >> security-summary.md << 'EOF'
        
        ---
        *Generated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')*
        EOF
        
        echo "::endgroup::"


    - name: Upload Security Reports
      id: upload-security-reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          trivy-report.json
          security-summary.md
        retention-days: 30

    - name: Comment Security Summary on PR
      id: comment-security-summary
      uses: thollander/actions-comment-pull-request@v2
      if: github.event_name == 'pull_request'
      with:
        filePath: security-summary.md
        comment_tag: security-scan
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Check Severity Threshold
      id: check-severity
      shell: bash
      run: |
        echo "::group::Severity Check"
        # Add logic to parse reports and fail based on severity
        # This is a placeholder - implement based on your requirements
        echo "Checking for vulnerabilities with severity: ${{ inputs.fail-on-severity }} or higher"
        echo "::endgroup::"
